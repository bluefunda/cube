name: Release

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Cube Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cube:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push oauth2-proxy Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.oauth2-proxy
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oauth2-proxy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
